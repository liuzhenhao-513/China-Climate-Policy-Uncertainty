[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "china-ccpu"
version = "1.0.0"
description = "China climate policy uncertainty index from newspaper text with a fine-tuned MacBERT classifier"
requires-python = ">=3.10"
dependencies = ["openpyxl>=3.1,<4", "scikit-learn>=1.3", "matplotlib>=3.7"]

[project.optional-dependencies]
model = ["torch>=2.0,<3", "transformers>=4.36,<5", "numpy>=1.24,<3"]

[project.scripts]
ccpu = "ccpu.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
